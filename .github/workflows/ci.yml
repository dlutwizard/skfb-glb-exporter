name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (windows / py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 运行测试（干净检出，无任何发布包）
        run: python -m pytest -q

      - name: 静态检查：不得存在关闭 TLS 校验的代码
        shell: pwsh
        run: |
          $hits = Select-String -Path dist_engine\*.py, app\*.py -Pattern 'CERT_NONE|check_hostname\s*=\s*False|verify\s*=\s*False' -AllMatches
          if ($hits) { $hits; exit 1 } else { echo "clean" }
